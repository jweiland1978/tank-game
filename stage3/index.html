<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Iron Rig</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body data-screen="title">
  <canvas id="game"></canvas>
  <div id="rotate-overlay" aria-hidden="true">
    <div>
      <strong>Rotate your device</strong>
      <p>Iron Rig plays in landscape.</p>
    </div>
  </div>

  <header id="top-hud">
    <div class="panel" id="hud-turn" data-testid="hud-turn">—</div>
    <div class="panel" id="hud-wind" data-testid="hud-wind">0</div>
    <div class="panel" id="hud-angle" data-testid="hud-angle">0°</div>
    <div class="panel meter-chip" id="hud-power" data-testid="hud-power"><span id="hud-power-label">Power 0</span><i id="power-meter"></i></div>
    <div class="panel" id="hud-weapon" data-testid="hud-weapon">—</div>
    <div class="panel" id="hud-fuel" data-testid="hud-fuel">Fuel 0</div>
    <div class="panel health" id="hud-health"></div>
  </header>

  <div id="turn-banner"></div>

  <section id="screen-title">
    <h1 id="game-title">Iron Rig</h1>
    <p class="tag">Dusk artillery</p>
    <button type="button" id="play-btn" data-testid="play-btn">Play</button>
    <p class="credit">Made with AI help</p>
  </section>

  <section id="screen-setup">
    <div class="setup-head">
      <div class="setup-title">Crew</div>
      <div class="count-row">
        <button type="button" data-testid="setup-count-2">2</button>
        <button type="button" data-testid="setup-count-3">3</button>
        <button type="button" data-testid="setup-count-4">4</button>
      </div>
      <button type="button" id="start-btn" data-testid="start-btn">Start</button>
    </div>
    <p class="setup-note">Pass the device. Humans play on their own turn.</p>
    <div class="opt-row" id="round-row">
      <span class="tname">Rounds</span>
      <button type="button" data-testid="setup-rounds-3">3</button>
      <button type="button" data-testid="setup-rounds-5">5</button>
      <button type="button" data-testid="setup-rounds-10">10</button>
      <span class="tname cashlab">Cash</span>
      <button type="button" data-testid="setup-cash-low">Low</button>
      <button type="button" data-testid="setup-cash-normal">Norm</button>
      <button type="button" data-testid="setup-cash-high">High</button>
    </div>
    <div class="opt-row" id="terrain-row">
      <span class="tname">Land</span>
      <button type="button" data-testid="setup-terrain-rolling">Hills</button>
      <button type="button" data-testid="setup-terrain-mountains">Mountains</button>
      <button type="button" data-testid="setup-terrain-canyon">Canyon</button>
      <button type="button" data-testid="setup-terrain-islands">Islands</button>
      <button type="button" data-testid="setup-terrain-spires">Spires</button>
      <button type="button" data-testid="setup-terrain-random">Random</button>
    </div>
    <div class="opt-row" id="extra-row">
      <button type="button" id="setup-taunts" data-testid="setup-taunts">Taunts: On</button>
      <button type="button" id="setup-handoff" data-testid="setup-handoff">Pass: On</button>
    </div>
    <div class="tank-row" id="tank-row-0">
      <i class="swatch" id="swatch-0"></i>
      <span class="tname">Red</span>
      <button type="button" data-testid="setup-cpu-0">Human</button>
      <button type="button" data-testid="setup-skill-0-easy">Easy</button>
      <button type="button" data-testid="setup-skill-0-normal">Normal</button>
      <button type="button" data-testid="setup-skill-0-hard">Hard</button>
    </div>
    <div class="tank-row" id="tank-row-1">
      <i class="swatch" id="swatch-1"></i>
      <span class="tname">Cyan</span>
      <button type="button" data-testid="setup-cpu-1">Computer</button>
      <button type="button" data-testid="setup-skill-1-easy">Easy</button>
      <button type="button" data-testid="setup-skill-1-normal">Normal</button>
      <button type="button" data-testid="setup-skill-1-hard">Hard</button>
    </div>
    <div class="tank-row" id="tank-row-2">
      <i class="swatch" id="swatch-2"></i>
      <span class="tname">Lime</span>
      <button type="button" data-testid="setup-cpu-2">Computer</button>
      <button type="button" data-testid="setup-skill-2-easy">Easy</button>
      <button type="button" data-testid="setup-skill-2-normal">Normal</button>
      <button type="button" data-testid="setup-skill-2-hard">Hard</button>
    </div>
    <div class="tank-row" id="tank-row-3">
      <i class="swatch" id="swatch-3"></i>
      <span class="tname">Gold</span>
      <button type="button" data-testid="setup-cpu-3">Computer</button>
      <button type="button" data-testid="setup-skill-3-easy">Easy</button>
      <button type="button" data-testid="setup-skill-3-normal">Normal</button>
      <button type="button" data-testid="setup-skill-3-hard">Hard</button>
    </div>
  </section>

  <div id="move-bar">
    <button type="button" data-testid="move-left-btn" aria-label="Drive left">◀ Move</button>
    <button type="button" data-testid="move-right-btn" aria-label="Drive right">Move ▶</button>
    <button type="button" data-testid="shield-btn" aria-label="Toggle shield">Shield</button>
  </div>

  <div id="controls">
    <button type="button" data-testid="angle-minus" aria-label="Decrease angle">A−</button>
    <button type="button" data-testid="angle-plus" aria-label="Increase angle">A+</button>
    <button type="button" data-testid="power-minus" aria-label="Decrease power">P−</button>
    <button type="button" data-testid="power-plus" aria-label="Increase power">P+</button>
    <button type="button" id="weapon-btn" data-testid="weapon-btn">Basic Shell</button>
    <button type="button" id="fire-btn" data-testid="fire-btn">FIRE</button>
  </div>

  <button type="button" id="volume-btn" data-testid="volume-btn" aria-label="Volume" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a5 5 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>
  <div id="volume-pop" hidden>
    <label class="vol-lab">Volume <input type="range" id="volume-slider" data-testid="volume-slider" min="0" max="100" value="85"></label>
    <button type="button" id="mute-btn" data-testid="mute-btn" aria-pressed="false"><span id="mute-label">Mute</span></button>
    <button type="button" id="taunts-toggle" data-testid="taunts-toggle">Taunts: On</button>
  </div>

  <section id="screen-winner">
    <div id="winner-card">
      <h2 id="winner-text" data-testid="winner-text">Draw</h2>
      <p id="winner-tally"></p>
      <div id="money-summary" data-testid="money-summary" hidden></div>
      <div class="winner-row">
        <button type="button" id="next-round-btn" data-testid="next-round-btn">Next round</button>
        <button type="button" id="menu-btn" data-testid="menu-btn">Menu</button>
      </div>
    </div>
  </section>

  <section id="screen-store" data-testid="store-screen">
    <div class="store-head">
      <h2 id="store-title">Store</h2>
      <div id="store-cash" data-testid="store-cash">$0</div>
      <button type="button" id="store-done-btn" data-testid="store-done-btn">Done</button>
    </div>
    <p id="store-note" class="store-note"></p>
    <div class="store-tabs">
      <button type="button" data-store-tab="weapon" data-testid="store-tab-weapons">Weapons</button>
      <button type="button" data-store-tab="accessory" data-testid="store-tab-accessories">Accessories</button>
      <button type="button" data-store-tab="upgrade" data-testid="store-tab-upgrades">Upgrades</button>
    </div>
    <div class="store-body">
      <div id="store-grid" class="store-grid"></div>
      <div id="store-more" data-testid="store-more" hidden>more ▼</div>
    </div>
  </section>

  <section id="screen-handoff" data-testid="handoff-screen">
    <h2 id="handoff-title">Pass the device</h2>
    <button type="button" id="handoff-go-btn" data-testid="handoff-go-btn">Go!</button>
  </section>

  <section id="screen-pass">
    <h2 id="pass-title">Pass the device</h2>
    <button type="button" id="pass-continue-btn" data-testid="pass-continue-btn">Continue</button>
  </section>

  <section id="screen-final" data-testid="final-standings">
    <h2>Final standings</h2>
    <ol id="final-list"></ol>
    <div class="winner-row">
      <button type="button" id="play-again-btn" data-testid="play-again-btn">Play again</button>
      <button type="button" id="final-menu-btn" data-testid="menu-btn">Menu</button>
    </div>
  </section>

  <script type="module" src="js/main.js?v=1"></script>
</body>
</html>
