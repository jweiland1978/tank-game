<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Iron Rig</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body data-screen="title">
  <canvas id="game"></canvas>
  <div id="rotate-overlay" aria-hidden="true">
    <div>
      <strong>Rotate your device</strong>
      <p>Iron Rig plays in landscape.</p>
    </div>
  </div>

  <header id="top-hud">
    <div class="panel" id="hud-turn" data-testid="hud-turn">—</div>
    <div class="panel" id="hud-wind" data-testid="hud-wind">0</div>
    <div class="panel" id="hud-angle" data-testid="hud-angle">0°</div>
    <div class="panel meter-chip" id="hud-power" data-testid="hud-power"><span id="hud-power-label">Power 0</span><i id="power-meter"></i></div>
    <div class="panel" id="hud-weapon" data-testid="hud-weapon">—</div>
    <div class="panel health" id="hud-health"></div>
  </header>

  <div id="turn-banner"></div>

  <section id="screen-title">
    <h1 id="game-title">Iron Rig</h1>
    <p class="tag">Dusk artillery</p>
    <button type="button" id="play-btn" data-testid="play-btn">Play</button>
    <p class="credit">Made with AI help</p>
  </section>

  <section id="screen-setup">
    <div class="setup-head">
      <div class="setup-title">Crew</div>
      <div class="count-row">
        <button type="button" data-testid="setup-count-2">2</button>
        <button type="button" data-testid="setup-count-3">3</button>
        <button type="button" data-testid="setup-count-4">4</button>
      </div>
      <button type="button" id="start-btn" data-testid="start-btn">Start</button>
    </div>
    <p class="setup-note">Pass the device. Humans play on their own turn.</p>
    <div class="tank-row" id="tank-row-0">
      <i class="swatch" id="swatch-0"></i>
      <span class="tname">Red</span>
      <button type="button" data-testid="setup-cpu-0">Human</button>
      <button type="button" data-testid="setup-skill-0-easy">Easy</button>
      <button type="button" data-testid="setup-skill-0-normal">Normal</button>
      <button type="button" data-testid="setup-skill-0-hard">Hard</button>
    </div>
    <div class="tank-row" id="tank-row-1">
      <i class="swatch" id="swatch-1"></i>
      <span class="tname">Cyan</span>
      <button type="button" data-testid="setup-cpu-1">Computer</button>
      <button type="button" data-testid="setup-skill-1-easy">Easy</button>
      <button type="button" data-testid="setup-skill-1-normal">Normal</button>
      <button type="button" data-testid="setup-skill-1-hard">Hard</button>
    </div>
    <div class="tank-row" id="tank-row-2">
      <i class="swatch" id="swatch-2"></i>
      <span class="tname">Lime</span>
      <button type="button" data-testid="setup-cpu-2">Computer</button>
      <button type="button" data-testid="setup-skill-2-easy">Easy</button>
      <button type="button" data-testid="setup-skill-2-normal">Normal</button>
      <button type="button" data-testid="setup-skill-2-hard">Hard</button>
    </div>
    <div class="tank-row" id="tank-row-3">
      <i class="swatch" id="swatch-3"></i>
      <span class="tname">Gold</span>
      <button type="button" data-testid="setup-cpu-3">Computer</button>
      <button type="button" data-testid="setup-skill-3-easy">Easy</button>
      <button type="button" data-testid="setup-skill-3-normal">Normal</button>
      <button type="button" data-testid="setup-skill-3-hard">Hard</button>
    </div>
  </section>

  <div id="controls">
    <button type="button" data-testid="angle-minus" aria-label="Decrease angle">A−</button>
    <button type="button" data-testid="angle-plus" aria-label="Increase angle">A+</button>
    <button type="button" data-testid="power-minus" aria-label="Decrease power">P−</button>
    <button type="button" data-testid="power-plus" aria-label="Increase power">P+</button>
    <button type="button" id="weapon-btn" data-testid="weapon-btn">Basic Shell</button>
    <button type="button" id="fire-btn" data-testid="fire-btn">FIRE</button>
  </div>

  <button type="button" id="mute-btn" data-testid="mute-btn" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a5 5 0 010 6M18.5 6.5a8 8 0 010 11"/></svg><span id="mute-label">Mute</span></button>

  <section id="screen-winner">
    <div id="winner-card">
      <h2 id="winner-text" data-testid="winner-text">Draw</h2>
      <p id="winner-tally"></p>
      <div class="winner-row">
        <button type="button" id="next-round-btn" data-testid="next-round-btn">Next round</button>
        <button type="button" id="menu-btn" data-testid="menu-btn">Menu</button>
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js?v=1"></script>
</body>
</html>
